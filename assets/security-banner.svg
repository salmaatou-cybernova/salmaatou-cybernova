<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4879C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D4879C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4879C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D4879C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4879C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- soft ambient glow behind shield -->
  <circle cx="450" cy="110" r="95" fill="url(#glow)"/>

  <!-- radar sweep rings pinging outward -->
  <circle cx="450" cy="110" r="30" fill="none" stroke="#D4879C" stroke-width="1.4" opacity="0.7">
    <animate attributeName="r" values="30;95" dur="3.2s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="3.2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="110" r="30" fill="none" stroke="#D4879C" stroke-width="1.4" opacity="0.7">
    <animate attributeName="r" values="30;95" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating radar sweep -->
  <g transform="translate(450,110)">
    <g>
      <path d="M0,0 L0,-95 A95,95 0 0,1 40,-86 Z" fill="#D4879C" opacity="0.18"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- dotted radar circle -->
  <circle cx="450" cy="110" r="70" fill="none" stroke="#D4879C" stroke-width="1" stroke-dasharray="2 6" opacity="0.45"/>

  <!-- shield -->
  <g transform="translate(450,110)">
    <path d="M0,-46 L38,-32 L38,6 C38,34 20,52 0,62 C-20,52 -38,34 -38,6 L-38,-32 Z"
          fill="#1a1a2e" fill-opacity="0.55" stroke="#D4879C" stroke-width="2.4"/>
    <!-- lock body -->
    <rect x="-13" y="-4" width="26" height="20" rx="3" fill="none" stroke="#ffe3ee" stroke-width="2.2"/>
    <path d="M-8,-4 L-8,-12 A8,8 0 0,1 8,-12 L8,-4" fill="none" stroke="#ffe3ee" stroke-width="2.2"/>
    <circle cx="0" cy="6" r="2.4" fill="#ffe3ee">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- left data flow line -->
  <line x1="60" y1="110" x2="330" y2="110" stroke="url(#lineFade)" stroke-width="1.2"/>
  <circle cx="60" cy="110" r="3" fill="#D4879C">
    <animate attributeName="cx" values="60;330;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="110" r="3" fill="#D4879C">
    <animate attributeName="cx" values="60;330;60" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- right data flow line -->
  <line x1="570" y1="110" x2="840" y2="110" stroke="url(#lineFade)" stroke-width="1.2"/>
  <circle cx="840" cy="110" r="3" fill="#D4879C">
    <animate attributeName="cx" values="840;570;840" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="110" r="3" fill="#D4879C">
    <animate attributeName="cx" values="840;570;840" dur="4s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- small network nodes left -->
  <circle cx="60" cy="110" r="4.5" fill="none" stroke="#D4879C" stroke-width="1.5"/>
  <circle cx="60" cy="70" r="3" fill="none" stroke="#D4879C" stroke-width="1.2" opacity="0.6"/>
  <circle cx="60" cy="150" r="3" fill="none" stroke="#D4879C" stroke-width="1.2" opacity="0.6"/>
  <line x1="60" y1="110" x2="60" y2="70" stroke="#D4879C" stroke-width="1" opacity="0.4"/>
  <line x1="60" y1="110" x2="60" y2="150" stroke="#D4879C" stroke-width="1" opacity="0.4"/>

  <!-- small network nodes right -->
  <circle cx="840" cy="110" r="4.5" fill="none" stroke="#D4879C" stroke-width="1.5"/>
  <circle cx="840" cy="70" r="3" fill="none" stroke="#D4879C" stroke-width="1.2" opacity="0.6"/>
  <circle cx="840" cy="150" r="3" fill="none" stroke="#D4879C" stroke-width="1.2" opacity="0.6"/>
  <line x1="840" y1="110" x2="840" y2="70" stroke="#D4879C" stroke-width="1" opacity="0.4"/>
  <line x1="840" y1="110" x2="840" y2="150" stroke="#D4879C" stroke-width="1" opacity="0.4"/>
</svg>
